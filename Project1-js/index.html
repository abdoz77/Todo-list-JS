<!doctype html>
<html lang="en">
   <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../Project1-js/pr.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Tajawal:wght@200;300;400;500;700;800;900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- icons -->
   
    <link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
/>
  </head>
  <body>
    <!-- main div -->
    <div class="main-div">
      <!-- tasks div -->
      <div class="tasks-lable">
        <!-- tasks div -->
        <div
          style="
            width: 100%;
            color: white;
            background-color: rgb(83, 0, 83);
            height: 90px;
            position: relative;
            top: -22px;
          "
        >
          <h1>مهامي</h1>
          <button id="add-task" class="add-task">
            <span class="material-symbols-outlined"> add </span>
          </button>
        </div>
        <!-- tasks section -->
        <div id="tasks" class="tasks-sec">
         


        </div>


      </div>
    </div>


  </body>



 <script>

  let tasks =[
    {
      title: "الذهاب الى النادي",
      date: "10/12/2026",
      isDone: true

    }

    ,
    {
      title: "الذهاب الى الساونا",
      date: "1/9/2026",
      isDone: false
    }
    ,
    
    {
      title: "الذهاب الى السباحة",
      date: "27/6/2026",
      isDone: false
    }
    ,
    
    {
      title: "درس القيادة",
      date: "10/12/2026",
      isDone: false

    }
    
    
  ]
  //  to get the stored data from the local storage and convert it as a code which is as string
    let retreivedTasks= JSON.parse(localStorage.getItem("tasks")) ; 
  // if (retreivedTasks == null) {
  //       tasks = [];
  //     }else {
  //       tasks = retreivedTasks;
  //     }


    tasks = retreivedTasks ?? [];
    
   function addtasksTothePage(){
    document.getElementById("tasks").innerHTML = "";
    let index = 0;
     for(task of tasks){

   let content = ` <div class="task ${task.isDone ? "done" : ""}">
            <!-- info -->
            <div class="task-info">
              <h2>${task.title}</h2>
              <span class="material-symbols-outlined">
              calendar_month
              </span>
              <span> ${task.date} </span>
            </div>

            <!-- buttons -->
            <div class="buttons-info">
            ${task.isDone ? `
            
             <button onclick="deleteTask(${index})" class="circle one">
                <span class="material-symbols-outlined"> delete </span>
              </button>

              <button onclick="markAsDone(${index})" class="circle " style="background-color: #ad1e1e; ">
                 
                <span class='material-symbols-outlined'> cancel </span>
                
              </button>
              
              <button  onclick="Updatetask(${index})" class="circle three">
                <span class="material-symbols-outlined"> edit </span>
              </button>
            
            ` :
            
            
            ` <button onclick="deleteTask(${index})" class="circle one">
                <span class="material-symbols-outlined"> delete </span>
              </button>

              <button onclick="markAsDone(${index})" class="circle two">
                 
                <span class='material-symbols-outlined'> done </span>
                
              </button>
              
              <button  onclick="Updatetask(${index})" class="circle three">
                <span class="material-symbols-outlined"> edit </span>
              </button>`}

            </div>



          </div>`;

          document.getElementById("tasks").innerHTML += content;
          index++;
        }

      }

      addtasksTothePage();

  
     
    document.getElementById("add-task").addEventListener("click", function () {
      let taskTitle = prompt("ادخل عنوان المهمة");
      // let taskDate = prompt("ادخل تاريخ المهمة");
      // first way to get the date
       let now = new Date();
       let taskDate = now.getDate() + "/" + (now.getMonth() +1) + "/" + now.getFullYear() + "|" + now.getHours() + ":" + now.getMinutes() ;
      let newTask = {
        title: taskTitle,
        date: taskDate,
        isDone: false,
      };
      

      tasks.push(newTask);
      saveTasks ();
      addtasksTothePage();
      
      
      
      
    });
    
    function deleteTask(index){
      console.log(index);
      let task = tasks[index];
      let isconfirmed = confirm(`هل انت متأكد من حذف مهمة "${task.title}" ؟`);
      if (isconfirmed) {
        tasks.splice(index, 1);
        saveTasks();
        addtasksTothePage();
      }
    }
    
    
    
    function Updatetask(index){
      let task = tasks[index];
      let newTitle = prompt("ادخل عنوان المهمة الجديد", task.title);
      if (newTitle) {
        task.title = newTitle;
        saveTasks();
        addtasksTothePage();
      }
     }
     

     
     
     
     function markAsDone(index) {
       let task = tasks[index];
       if (!task.isDone) {
         task.isDone = true;
         saveTasks();
      } else {
        task.isDone = false;
        saveTasks();
      }
      addtasksTothePage();
     }
     
     
     
     
     // ----- local storage function------
     
     function saveTasks() {
       
       let tasksString= JSON.stringify(tasks);
       localStorage.setItem("tasks", tasksString);
    }
    
    
    
    
    
    
    </script>




</html>
